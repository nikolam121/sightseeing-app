<!DOCTYPE html>
<html lang="hr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nova atrakcija</title>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<h1>Unos nove atrakcije</h1>


<form th:action="@{/browse/attractions/new}" th:object="${attractionForm}" method="post">

    <div>
        <label for="place">Mjesto</label>
        <input type="text" id="place" th:field="*{place}" maxlength="30" />
    </div>

    <div>
        <label for="name">Naziv</label>
        <input type="text" id="name" th:field="*{name}" maxlength="50" />
    </div>

    <div>
        <label for="description">Opis</label>
        <textarea id="description" th:field="*{description}" maxlength="250"></textarea>
    </div>

    <div>
        <label for="type">Tip</label>
        <select id="type" th:field="*{type}">
            <option th:each="t : ${types}" th:value="${t}" th:text="${t}"></option>
        </select>
    </div>

    <button type="submit">Unesi</button>
</form>
</body>
</html>
